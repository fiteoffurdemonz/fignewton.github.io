<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fig is a dog ig</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: white;
    }
    #bg {
      position: fixed;
      inset: 0;
      color: #ccc;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-all;
      white-space: pre-wrap;
      padding: 8px;
      z-index: 0;
      user-select: none;
    }
    img {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <img id="photo" alt="fig is a dog ig">

  <script>
    const images = [
      "images/image1.jpg",
      "images/image2.JPG",
      "images/image3.jpeg",
      "images/image4.JPG",
      "images/image5.jpg",
      "images/image6.jpeg",
      "images/image7.JPG",
      "images/image8.jpg",
      "images/image9.JPG",
      "images/image10.JPG",
      "images/image11.JPG",
      "images/image12.jpg",
      "images/image13.JPG",
      "images/image14.jpg",
      "images/image15.JPG",
      "images/image16.JPG",
      "images/image17.JPG",
      "images/image18.JPG",
      "images/image19.JPG",
      "images/image20.JPG",
      "images/image21.JPG",
      "images/image22.jpg",
      "images/image23.jpg",
      "images/image24.JPG",
    ];

    const random = Math.floor(Math.random() * images.length);
    document.getElementById("photo").src = images[random];

    const faces = ["U•ᴥ•U", "^..^", "=^.^=", "U•ᴥ•U", "(◕ᴥ◕)"];
    const bg = document.getElementById("bg");
    const cols = Math.ceil(window.innerWidth / 8);
    const rows = Math.ceil(window.innerHeight / 18);
    let text = "";
    for (let r = 0; r < rows; r++) {
      let line = "";
      while (line.length < cols) {
        line += faces[Math.floor(Math.random() * faces.length)] + "  ";
      }
      text += line + "\n";
    }
    bg.textContent = text;
  </script>
</body>
</html>
